spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:citas_fcv_training}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  password-recovery:
    expose-token: ${PASSWORD_RECOVERY_EXPOSE_TOKEN:false}
  admin:
    bootstrap-token: ${ADMIN_BOOTSTRAP_TOKEN:}
  test-data:
    enabled: ${TEST_DATA_ENABLED:false}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
